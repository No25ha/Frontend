<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DailyFlow</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="/config.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/app.css" />
</head>
<body x-data="{
        selected: null,
        editing: null,
        addModalOpen: false,
        timeEntryModalOpen: false,
        timeEntryTask: null,
        projectModalOpen: false,
        projectForm: { name: '', description: '', state: 'active' },
        taskFilters: { q: '', priority: '', state: '', sort: 'newest' },
        projectFilters: { q: '', state: '' },
        toast: null,
        tasksPage: 1,
        newTaskProjectName: '',
        // ---------- Auth ----------
        authToken: null,
        authUser: null,
        authChecking: true,
        loginForm: { identifier: '', password: '' },
        loginError: '',
        loginSubmitting: false,
        initAuth() {
            this.authToken = localStorage.getItem('dailyflow_token');
            if (!this.authToken) { this.authChecking = false; return; }
            this.fetchMe().then((ok) => {
                this.authChecking = false;
                if (ok) this.initProjectsFromUrl();
            });
        },
        fetchMe() {
            return fetch(window.API_BASE + '/api/users/me?populate=role', {
                headers: { Authorization: 'Bearer ' + this.authToken }
            })
                .then((res) => {
                    if (!res.ok) throw new Error('invalid session');
                    return res.json();
                })
                .then((user) => { this.authUser = user; return true; })
                .catch(() => { this.clearSession(); return false; });
        },
        login() {
            this.loginError = '';
            this.loginSubmitting = true;
            fetch(window.API_BASE + '/api/auth/local', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: this.loginForm.identifier, password: this.loginForm.password })
            })
                .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
                .then(({ ok, data }) => {
                    if (!ok) {
                        this.loginSubmitting = false;
                        this.loginError = (data.error && data.error.message) || 'Login failed. Check your email/username and password.';
                        return;
                    }
                    this.authToken = data.jwt;
                    localStorage.setItem('dailyflow_token', data.jwt);
                    this.loginForm = { identifier: '', password: '' };
                    return this.fetchMe().then((ok2) => {
                        this.loginSubmitting = false;
                        if (ok2) this.initProjectsFromUrl();
                    });
                })
                .catch(() => {
                    this.loginSubmitting = false;
                    this.loginError = 'Could not reach the server.';
                });
        },
        clearSession() {
            this.authToken = null;
            this.authUser = null;
            localStorage.removeItem('dailyflow_token');
            this.selected = null;
        },
        logout() { this.clearSession(); },
        isManager() {
            const type = this.authUser?.role?.type;
            return type === 'owner' || type === 'team_lead';
        },
        // ---------- Account (change own password) ----------
        accountModalOpen: false,
        changePasswordForm: { currentPassword: '', password: '', passwordConfirmation: '' },
        changePasswordError: '',
        changePasswordSubmitting: false,
        openAccountModal() {
            this.changePasswordForm = { currentPassword: '', password: '', passwordConfirmation: '' };
            this.changePasswordError = '';
            this.accountModalOpen = true;
        },
        changePassword() {
            this.changePasswordError = '';
            if (this.changePasswordForm.password.length < 6) {
                this.changePasswordError = 'New password must be at least 6 characters.';
                return;
            }
            if (this.changePasswordForm.password !== this.changePasswordForm.passwordConfirmation) {
                this.changePasswordError = 'New passwords do not match.';
                return;
            }
            this.changePasswordSubmitting = true;
            fetch(window.API_BASE + '/api/auth/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.authToken },
                body: JSON.stringify({
                    currentPassword: this.changePasswordForm.currentPassword,
                    password: this.changePasswordForm.password,
                })
            })
                .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
                .then(({ ok, data }) => {
                    this.changePasswordSubmitting = false;
                    if (!ok) {
                        this.changePasswordError = (data.error && data.error.message) || 'Could not change password.';
                        return;
                    }
                    this.authToken = data.jwt;
                    localStorage.setItem('dailyflow_token', data.jwt);
                    this.accountModalOpen = false;
                    showToast('Password changed.');
                })
                .catch(() => {
                    this.changePasswordSubmitting = false;
                    this.changePasswordError = 'Could not reach the server.';
                });
        },
        // ---------- Projects / Tasks ----------
        closeProjectModal() {
            this.projectModalOpen = false;
            this.projectForm = { name: '', description: '', state: 'active' };
        },
        selectProject(el) {
            this.selected = { id: el.dataset.id, name: el.dataset.name, count: Number(el.dataset.count) };
            this.taskFilters = { q: '', priority: '', state: '', sort: 'newest' };
            this.loadTasks(1);
        },
        tasksUrl(page) {
            if (!this.selected) return null;
            const params = new URLSearchParams();
            params.set('filters[project][documentId][$eq]', this.selected.id);
            if (this.taskFilters.q) params.set('filters[title][$containsi]', this.taskFilters.q);
            if (this.taskFilters.priority) params.set('filters[priority][$eq]', this.taskFilters.priority);
            if (this.taskFilters.state) params.set('filters[state][$eq]', this.taskFilters.state);
            const sortMap = { newest: 'createdAt:desc', oldest: 'createdAt:asc', priority: 'priority:desc', planned: 'plannedDate:asc' };
            params.set('sort', sortMap[this.taskFilters.sort] || 'createdAt:desc');
            params.set('pagination[page]', page || 1);
            return '/api/tasks?' + params.toString();
        },
        loadTasks(page) {
            this.tasksPage = page || 1;
            const url = this.tasksUrl(this.tasksPage);
            if (!url) return;
            htmx.ajax('GET', url, { target: '#tasks', swap: 'innerHTML' });
        },
        goToTasksPage(page) { this.loadTasks(page); },
        projectsPage: 1,
        projectsUrl(page) {
            const params = new URLSearchParams();
            if (this.projectFilters.q) params.set('filters[name][$containsi]', this.projectFilters.q);
            if (this.projectFilters.state) params.set('filters[state][$eq]', this.projectFilters.state);
            params.set('pagination[page]', page || 1);
            return '/api/projects?' + params.toString();
        },
        loadProjects(page) {
            this.projectsPage = page || 1;
            htmx.ajax('GET', this.projectsUrl(this.projectsPage), { target: '#projects', swap: 'innerHTML' });

            const params = new URLSearchParams(window.location.search);
            this.projectFilters.q ? params.set('projects_q', this.projectFilters.q) : params.delete('projects_q');
            this.projectFilters.state ? params.set('projects_state', this.projectFilters.state) : params.delete('projects_state');
            this.projectsPage > 1 ? params.set('projects_page', this.projectsPage) : params.delete('projects_page');
            const query = params.toString();
            window.history.replaceState({}, '', window.location.pathname + (query ? '?' + query : ''));
        },
        goToProjectsPage(page) { this.loadProjects(page); },
        initProjectsFromUrl() {
            const params = new URLSearchParams(window.location.search);
            this.projectFilters.q = params.get('projects_q') || '';
            this.projectFilters.state = params.get('projects_state') || '';
            this.loadProjects(parseInt(params.get('projects_page'), 10) || 1);
        }
    }"
      @open-edit="editing = $event.detail"
      @open-time-entry="timeEntryTask = $event.detail; timeEntryModalOpen = true"
      @refresh-tasks="$nextTick(() => { if(selected) loadTasks(tasksPage) })"
      @refresh-projects="$nextTick(() => loadProjects(projectsPage))"
      @show-toast.window="toast = $event.detail; clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(() => toast = null, 4500)"
      @session-expired.window="clearSession(); toast = 'Your session has expired — please log in again.'; clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(() => toast = null, 4500)"
      x-init="initAuth()">
    <div>
        <div class="toast" x-show="toast" x-cloak x-transition x-text="toast" @click="toast = null"></div>

        <div class="login-screen" x-show="!authChecking && !authToken" x-cloak>
            <form class="login-card" @submit.prevent="login()">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 12.5L9.5 18L20 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1>DailyFlow</h1>
                <p class="subtitle">Sign in to continue</p>
                <div class="login-card__error" x-show="loginError" x-cloak x-text="loginError"></div>
                <input type="text" name="identifier" class="form-control" placeholder="Email or username"
                       x-model="loginForm.identifier" required autocomplete="username" />
                <input type="password" name="password" class="form-control" placeholder="Password"
                       x-model="loginForm.password" required autocomplete="current-password" />
                <button type="submit" :disabled="loginSubmitting" x-text="loginSubmitting ? 'Signing in…' : 'Sign in'"></button>
            </form>
        </div>

        <div x-show="authToken" x-cloak>
            <header>
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 12.5L9.5 18L20 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div>
                    <h1>DailyFlow</h1>
                    <p class="subtitle">
                        Strapi returns HTML · HTMX handles requests · Alpine handles UI state
                    </p>
                </div>
                <div class="header-user">
                    <span x-text="authUser?.username"></span>
                    <span class="badge" x-show="authUser?.role?.name" x-text="authUser?.role?.name"></span>
                    <button type="button" class="btn-ghost" x-show="isManager()"
                        hx-get="/api/team/modal" hx-target="#modal-container" hx-swap="innerHTML">Team</button>
                    <button type="button" class="btn-ghost" @click="openAccountModal()">Account</button>
                    <button type="button" class="btn-ghost" @click="logout()">Log out</button>
                </div>
            </header>
            <div class="layout">
                <aside class="panel">
                    <div class="section-head section-head--projects">
                        <h2>Projects</h2>
                        <button type="button" class="btn-icon" @click="projectForm = { name: '', description: '', state: 'active' }; projectModalOpen = true" title="Add project">＋</button>
                    </div>
                    <div class="project-toolbar">
                        <input type="search" class="form-control project-toolbar__search" placeholder="Search projects…"
                               x-model="projectFilters.q" @input.debounce.400ms="loadProjects()" />
                        <select class="form-select" x-model="projectFilters.state" @change="loadProjects()">
                            <option value="">All states</option>
                            <option value="active">Active</option>
                            <option value="archived">Archived</option>
                        </select>
                    </div>
                    <div id="projects" class="project-list">
                        Loading projects...
                    </div>
                </aside>
                <main class="panel">
                    <p x-show="!selected" class="empty placeholder">
                        ← Select a project to see its tasks.
                    </p>
                    <div x-show="selected" x-cloak>
                        <header class="detail__head">
                            <div>
                                <h2 class="detail__title" x-text="selected?.name"></h2>
                                <span class="badge" x-text="(selected?.count || 0) + ' tasks'"></span>
                            </div>
                            <button type="button" class="btn-icon" @click="addModalOpen = true; newTaskProjectName = selected ? selected.name : ''" title="Add task">➕</button>
                        </header>
                        <div class="task-toolbar">
                            <input type="search" class="form-control task-toolbar__search" placeholder="Search tasks…"
                                   x-model="taskFilters.q" @input.debounce.400ms="loadTasks()" />
                            <select class="form-select" x-model="taskFilters.priority" @change="loadTasks()">
                                <option value="">All priorities</option>
                                <option value="low">Low priority</option>
                                <option value="high">High priority</option>
                            </select>
                            <select class="form-select" x-model="taskFilters.state" @change="loadTasks()">
                                <option value="">All states</option>
                                <option value="pending">Pending</option>
                                <option value="active">Active</option>
                                <option value="paused">Paused</option>
                                <option value="completed">Completed</option>
                            </select>
                            <select class="form-select" x-model="taskFilters.sort" @change="loadTasks()">
                                <option value="newest">Newest first</option>
                                <option value="oldest">Oldest first</option>
                                <option value="priority">By priority</option>
                                <option value="planned">By planned date</option>
                            </select>
                        </div>
                        <div id="tasks" class="task-list" :data-sort="taskFilters.sort"></div>
                    </div>
                </main>
            </div>
        </div>


        <!-- New project modal -->
        <template x-if="projectModalOpen">
            <div class="modal" @click.self="closeProjectModal()">
                <form class="task-edit"
                      hx-post="/api/projects"
                      hx-swap="none"
                      x-init="htmx.process($el)"
                      @htmx:after-request="closeProjectModal(); $el.reset(); $dispatch('refresh-projects')">
                    <h3>New project</h3>
                    <input type="text" name="name" class="form-control" placeholder="Project name" x-model="projectForm.name" required />
                    <textarea name="description" class="form-control" rows="4" placeholder="Project description" x-model="projectForm.description"></textarea>
                    <select name="state" class="form-select" x-model="projectForm.state">
                        <option value="active">active</option>
                        <option value="archived">archived</option>
                    </select>
                    <p class="form-hint">Save the project first, then reopen it to assign team members.</p>
                    <div class="task-edit__actions">
                        <button type="submit">Add</button>
                        <button type="button" class="btn-ghost" @click="closeProjectModal()">Cancel</button>
                    </div>
                </form>
            </div>
        </template>


        <!-- Account modal (change own password) -->
        <template x-if="accountModalOpen">
            <div class="modal" @click.self="accountModalOpen = false">
                <form class="task-edit" @submit.prevent="changePassword()">
                    <h3>Change password</h3>
                    <div class="login-card__error" x-show="changePasswordError" x-cloak x-text="changePasswordError"></div>
                    <input type="password" class="form-control" placeholder="Current password"
                           x-model="changePasswordForm.currentPassword" required autocomplete="current-password" />
                    <input type="password" class="form-control" placeholder="New password"
                           x-model="changePasswordForm.password" required minlength="6" autocomplete="new-password" />
                    <input type="password" class="form-control" placeholder="Confirm new password"
                           x-model="changePasswordForm.passwordConfirmation" required minlength="6" autocomplete="new-password" />
                    <div class="task-edit__actions">
                        <button type="submit" :disabled="changePasswordSubmitting" x-text="changePasswordSubmitting ? 'Saving…' : 'Save'"></button>
                        <button type="button" class="btn-ghost" @click="accountModalOpen = false">Cancel</button>
                    </div>
                </form>
            </div>
        </template>


        <!-- Add task modal (from URL) -->
        <div x-show="addModalOpen" class="modal" @click.self="addModalOpen = false" style="display:none">
            <form class="task-edit" hx-post="/api/tasks/from-url" hx-swap="none"
                @htmx:after-request="if ($event.detail.elt === $el && $event.detail.successful) { addModalOpen = false; $el.reset(); newTaskProjectName = ''; $dispatch('refresh-tasks'); $dispatch('refresh-projects') }">
                <h3>New task</h3>

                <label class="url-import__label">Import from URL (optional)</label>
                <input type="url" name="url" class="form-control"
                       placeholder="https://example.com/projects/ecommerce/tasks/fix-login"
                       hx-post="/api/tasks/parse-url"
                       hx-trigger="input changed delay:400ms"
                       hx-target="#url-preview"
                       hx-swap="innerHTML" />
                <div id="url-preview"></div>

                <input id="field-projectName" type="text" name="projectName" class="form-control" placeholder="Project name..." x-model="newTaskProjectName" />
                <input id="field-title" type="text" name="title" class="form-control" placeholder="Task title..." required />
                <div class="task-edit__row">
                    <select name="priority" class="form-select">
                        <option value="low">low</option>
                        <option value="high">high</option>
                    </select>
                    <select name="state" class="form-select">
                        <option value="pending">pending</option>
                        <option value="active">active</option>
                        <option value="paused">paused</option>
                        <option value="completed">completed</option>
                    </select>
                </div>
                <div class="task-edit__actions">
                    <button type="submit">Add</button>
                    <button type="button" class="btn-ghost" @click="addModalOpen = false">Cancel</button>
                </div>
            </form>
        </div>


        <!-- Edit task modal -->
        <template x-if="editing">
            <div class="modal" @click.self="editing = null">
                <form class="task-edit"
                      :hx-put="'/api/tasks/' + editing.id"
                      :hx-target="'#task-' + editing.id"
                      hx-swap="outerHTML"
                      x-init="htmx.process($el)"
                      @htmx:after-request="editing = null">
                    <h3>Edit task</h3>
                    <input type="text" name="title" class="form-control" :value="editing.title" required />
                    <div class="task-edit__row">
                        <select name="priority" class="form-select" x-model="editing.priority">
                            <option value="low">low</option>
                            <option value="high">high</option>
                        </select>
                        <select name="state" class="form-select" x-model="editing.state">
                            <option value="pending">pending</option>
                            <option value="active">active</option>
                            <option value="paused">paused</option>
                            <option value="completed">completed</option>
                        </select>
                    </div>
                    <input type="hidden" name="project" :value="selected?.id" />
                    <div class="task-edit__actions">
                        <button type="submit">Save</button>
                        <button type="button" class="btn-ghost" @click="editing = null">Cancel</button>
                    </div>
                </form>
            </div>
        </template>

        <!-- Time entry modal -->
        <template x-if="timeEntryModalOpen">
            <div class="modal" @click.self="timeEntryModalOpen = false; timeEntryTask = null">
                <form class="task-edit" hx-post="/api/time-entries" hx-swap="none"
                      x-init="htmx.process($el)"
                      @htmx:after-request="timeEntryModalOpen = false; timeEntryTask = null; $el.reset(); $dispatch('refresh-tasks')">
                    <h3>Track time — <span x-text="timeEntryTask?.title"></span></h3>
                    <input type="datetime-local" name="startedAt" class="form-control" required />
                    <input type="datetime-local" name="stoppedAt" class="form-control" required />
                    <input type="hidden" name="task" :value="timeEntryTask?.id" />
                    <div class="task-edit__actions">
                        <button type="submit">Add</button>
                        <button type="button" class="btn-ghost" @click="timeEntryModalOpen = false; timeEntryTask = null">Cancel</button>
                    </div>
                </form>
            </div>
        </template>

        <!-- Container for HTMX-loaded modals (team, project edit) -->
        <div id="modal-container"></div>
    </div>
</body>
</html>
