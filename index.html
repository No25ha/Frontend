<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DailyFlow</title>
    <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/app.css" />
    <script>
    window.API_BASE = 'http://127.0.0.1:1337';

    document.addEventListener('htmx:validateUrl', function(e) {
      var allowed = new URL(window.API_BASE).origin;
      if (!e.detail.sameHost && new URL(e.detail.url, location.href).origin !== allowed) e.preventDefault();
    });

    document.addEventListener('htmx:configRequest', function(e) {
      if (e.detail.path.startsWith('/')) e.detail.path = window.API_BASE + e.detail.path;
      if (e.detail.verb === 'get') {
        for (var key of Object.keys(e.detail.parameters)) {
          if (e.detail.parameters[key] === '') delete e.detail.parameters[key];
        }
      }
      var token = localStorage.getItem('dailyflow_token');
      if (token) e.detail.headers['Authorization'] = 'Bearer ' + token;
    });

    document.addEventListener('htmx:beforeSwap', function(e) {
      if (e.detail.xhr.status === 204) { e.detail.shouldSwap = true; e.detail.isError = false; }
    });

    document.addEventListener('htmx:afterSettle', function(e) {
      if (window.Alpine) Alpine.initTree(e.detail.target);
    });

    document.addEventListener('htmx:responseError', function(e) {
      var xhr = e.detail.xhr;
      if (xhr && typeof xhr.responseText === 'string' && xhr.responseText.includes('dailyflow:duplicate-task-title')) {
        window.dispatchEvent(new CustomEvent('show-toast', { detail: 'A task with this title already exists in this project.' }));
        return;
      }
      var msg = null;
      try { var body = JSON.parse(xhr.responseText); msg = body && body.error && body.error.message; if (msg === 'Forbidden' || msg === 'Unauthorized') msg = null; } catch(err) {}
      if (xhr && (xhr.status === 401 || xhr.status === 403)) {
        var token = localStorage.getItem('dailyflow_token');
        if (!token) { window.dispatchEvent(new CustomEvent('show-toast', { detail: 'Please log in.' })); return; }
        fetch(window.API_BASE + '/api/users/me', { headers: { Authorization: 'Bearer ' + token } })
          .then(function(res) {
            if (!res.ok) { localStorage.removeItem('dailyflow_token'); window.dispatchEvent(new CustomEvent('session-expired')); return; }
            window.dispatchEvent(new CustomEvent('show-toast', { detail: msg || 'Request failed (' + xhr.status + '). Please try again.' }));
          })
          .catch(function() { window.dispatchEvent(new CustomEvent('show-toast', { detail: 'Request failed (' + xhr.status + '). Please try again.' })); });
        return;
      }
      window.dispatchEvent(new CustomEvent('show-toast', { detail: msg || 'Request failed (' + xhr.status + '). Please try again.' }));
    });

    document.addEventListener('htmx:sendError', function() {
      window.dispatchEvent(new CustomEvent('show-toast', { detail: 'Could not reach the server. Check your connection.' }));
    });
    </script>
</head>
<body x-data="{
        selected: null,
        editing: null,
        addModalOpen: false,
        timeEntryModalOpen: false,
        timeEntryTask: null,
        projectModalOpen: false,
        projectForm: { name: '', description: '', state: 'active' },
        toast: null,
        newTaskProjectName: '',
        // ---------- Auth ----------
        authToken: null,
        authUser: null,
        authChecking: true,
        loginForm: { identifier: '', password: '' },
        loginError: '',
        loginSubmitting: false,
        initAuth() {
            this.authToken = localStorage.getItem('dailyflow_token');
            if (!this.authToken) { this.authChecking = false; return; }
            this.fetchMe().then((ok) => {
                this.authChecking = false;
                if (ok) this.$dispatch('load-projects');
            });
        },
        fetchMe() {
            return fetch(window.API_BASE + '/api/users/me?populate=role', {
                headers: { Authorization: 'Bearer ' + this.authToken }
            })
                .then((res) => {
                    if (!res.ok) throw new Error('invalid session');
                    return res.json();
                })
                .then((user) => { this.authUser = user; return true; })
                .catch(() => { this.clearSession(); return false; });
        },
        login() {
            this.loginError = '';
            this.loginSubmitting = true;
            fetch(window.API_BASE + '/api/auth/local', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: this.loginForm.identifier, password: this.loginForm.password })
            })
                .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
                .then(({ ok, data }) => {
                    if (!ok) {
                        this.loginSubmitting = false;
                        this.loginError = (data.error && data.error.message) || 'Login failed. Check your email/username and password.';
                        return;
                    }
                    this.authToken = data.jwt;
                    localStorage.setItem('dailyflow_token', data.jwt);
                    this.loginForm = { identifier: '', password: '' };
                    return this.fetchMe().then((ok2) => {
                        this.loginSubmitting = false;
                        if (ok2) this.$dispatch('load-projects');
                    });
                })
                .catch(() => {
                    this.loginSubmitting = false;
                    this.loginError = 'Could not reach the server.';
                });
        },
        clearSession() {
            this.authToken = null;
            this.authUser = null;
            localStorage.removeItem('dailyflow_token');
            this.selected = null;
        },
        logout() { this.clearSession(); },
        isManager() {
            const type = this.authUser?.role?.type;
            return type === 'owner' || type === 'team_lead';
        },
        _perms: {
            owner: { 'project.create': 1, 'project.update': 1, 'project.delete': 1, 'task.create': 1, 'task.update': 1, 'task.delete': 1, 'time-entry.create': 1, 'time-entry.update': 1, 'time-entry.delete': 1, 'team.view': 1, 'team.createTeamLead': 1, 'team.deleteTeamLead': 1, 'team.createEmployee': 1, 'team.deleteEmployee': 1, 'team.resetTeamLeadPassword': 1, 'team.resetEmployeePassword': 1 },
            team_lead: { 'project.create': 1, 'project.update': 1, 'project.delete': 1, 'task.create': 1, 'task.update': 1, 'task.delete': 1, 'time-entry.create': 1, 'time-entry.update': 1, 'time-entry.delete': 1, 'team.view': 1, 'team.createEmployee': 1, 'team.deleteEmployee': 1, 'team.resetEmployeePassword': 1 },
            employee: { 'task.create': 1, 'task.update': 1, 'time-entry.create': 1, 'time-entry.update': 1, 'time-entry.delete': 1 }
        },
        can(permission) {
            const roleType = this.authUser?.role?.type;
            if (!roleType) return false;
            return !!(this._perms[roleType] && this._perms[roleType][permission]);
        },
        // ---------- Account (change own password) ----------
        accountModalOpen: false,
        changePasswordForm: { currentPassword: '', password: '', passwordConfirmation: '' },
        changePasswordError: '',
        changePasswordSubmitting: false,
        openAccountModal() {
            this.changePasswordForm = { currentPassword: '', password: '', passwordConfirmation: '' };
            this.changePasswordError = '';
            this.accountModalOpen = true;
        },
        changePassword() {
            this.changePasswordError = '';
            if (this.changePasswordForm.password.length < 6) {
                this.changePasswordError = 'New password must be at least 6 characters.';
                return;
            }
            if (this.changePasswordForm.password !== this.changePasswordForm.passwordConfirmation) {
                this.changePasswordError = 'New passwords do not match.';
                return;
            }
            this.changePasswordSubmitting = true;
            fetch(window.API_BASE + '/api/auth/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.authToken },
                body: JSON.stringify({
                    currentPassword: this.changePasswordForm.currentPassword,
                    password: this.changePasswordForm.password,
                })
            })
                .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
                .then(({ ok, data }) => {
                    this.changePasswordSubmitting = false;
                    if (!ok) {
                        this.changePasswordError = (data.error && data.error.message) || 'Could not change password.';
                        return;
                    }
                    this.authToken = data.jwt;
                    localStorage.setItem('dailyflow_token', data.jwt);
                    this.accountModalOpen = false;
                    window.dispatchEvent(new CustomEvent('show-toast', { detail: 'Password changed.' }));
                })
                .catch(() => {
                    this.changePasswordSubmitting = false;
                    this.changePasswordError = 'Could not reach the server.';
                });
        },
        // ---------- Projects / Tasks ----------
        closeProjectModal() {
            this.projectModalOpen = false;
            this.projectForm = { name: '', description: '', state: 'active' };
        },
        selectProject(el) {
            this.selected = { id: el.dataset.id, name: el.dataset.name, count: Number(el.dataset.count) };
            if (this.$refs.taskForm) this.$refs.taskForm.reset();
            this.$nextTick(() => this.$dispatch('load-tasks'));
        }
    }"
      @open-edit="editing = $event.detail"
      @open-time-entry="timeEntryTask = $event.detail; timeEntryModalOpen = true"
      @refresh-tasks="if(selected) $dispatch('load-tasks')"
      @refresh-projects="$dispatch('load-projects')"
      @show-toast.window="toast = $event.detail; clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(() => toast = null, 4500)"
      @session-expired.window="clearSession(); toast = 'Your session has expired — please log in again.'; clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(() => toast = null, 4500)"
      x-init="initAuth()">
    <div>
        <div class="toast" x-show="toast" x-cloak x-transition x-text="toast" @click="toast = null"></div>

        <div class="login-screen" x-show="!authChecking && !authToken" x-cloak>
            <form class="login-card" @submit.prevent="login()">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 12.5L9.5 18L20 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1>DailyFlow</h1>
                <p class="subtitle">Sign in to continue</p>
                <div class="login-card__error" x-show="loginError" x-cloak x-text="loginError"></div>
                <input type="text" name="identifier" class="form-control" placeholder="Email or username"
                       x-model="loginForm.identifier" required autocomplete="username" />
                <input type="password" name="password" class="form-control" placeholder="Password"
                       x-model="loginForm.password" required autocomplete="current-password" />
                <button type="submit" :disabled="loginSubmitting" x-text="loginSubmitting ? 'Signing in…' : 'Sign in'"></button>
            </form>
        </div>

        <div x-show="authToken" x-cloak>
            <header>
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 12.5L9.5 18L20 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div>
                    <h1>DailyFlow</h1>
                    <p class="subtitle">
                        Strapi returns HTML · HTMX handles requests · Alpine handles UI state
                    </p>
                </div>
                <div class="header-user">
                    <span x-text="authUser?.username"></span>
                    <span class="badge" x-show="authUser?.role?.name" x-text="authUser?.role?.name"></span>
                    <button type="button" class="btn-ghost" x-show="isManager()"
                        hx-get="/api/groups/modal" hx-target="#modal-container" hx-swap="innerHTML">Groups</button>
                    <button type="button" class="btn-ghost" x-show="isManager()"
                        hx-get="/api/team/modal" hx-target="#modal-container" hx-swap="innerHTML">Team</button>
                    <button type="button" class="btn-ghost" @click="openAccountModal()">Account</button>
                    <button type="button" class="btn-ghost" @click="logout()">Log out</button>
                </div>
            </header>
            <div class="layout">
                <aside class="panel">
                    <div class="section-head section-head--projects">
                        <h2>Projects</h2>
                        <button type="button" class="btn-icon" x-show="can('project.create')"
                            hx-get="/api/projects/create-form" hx-target="#project-create-modal" hx-swap="innerHTML"
                            title="Add project">＋</button>
                    </div>
                    <form id="project-filters" class="project-toolbar"
                          hx-get="/api/projects" hx-target="#projects" hx-swap="innerHTML"
                          hx-trigger="load-projects from:body, input changed delay:400ms from:find input, change from:find select">
                        <input type="search" name="filters[name][$containsi]" class="form-control project-toolbar__search" placeholder="Search projects…" />
                        <select name="filters[state][$eq]" class="form-select">
                            <option value="">All states</option>
                            <option value="active">Active</option>
                            <option value="archived">Archived</option>
                        </select>
                    </form>
                    <div id="projects" class="project-list">
                        Loading projects...
                    </div>
                </aside>
                <main class="panel">
                    <p x-show="!selected" class="empty placeholder">
                        ← Select a project to see its tasks.
                    </p>
                    <div x-show="selected" x-cloak>
                        <header class="detail__head">
                            <div>
                                <h2 class="detail__title" x-text="selected?.name"></h2>
                                <span class="badge" x-text="(selected?.count || 0) + ' tasks'"></span>
                            </div>
                            <button type="button" class="btn-icon" @click="addModalOpen = true; newTaskProjectName = selected ? selected.name : ''" title="Add task">➕</button>
                        </header>
                        <form id="task-filters" x-ref="taskForm" class="task-toolbar"
                              hx-get="/api/tasks" hx-target="#tasks" hx-swap="innerHTML"
                              hx-trigger="load-tasks from:body, input changed delay:400ms from:find input, change from:find select">
                            <input type="hidden" name="filters[project][documentId][$eq]" :value="selected?.id" />
                            <input type="search" name="filters[title][$containsi]" class="form-control task-toolbar__search" placeholder="Search tasks…" />
                            <select name="filters[priority][$eq]" class="form-select">
                                <option value="">All priorities</option>
                                <option value="low">Low priority</option>
                                <option value="high">High priority</option>
                            </select>
                            <select name="filters[state][$eq]" class="form-select">
                                <option value="">All states</option>
                                <option value="pending">Pending</option>
                                <option value="active">Active</option>
                                <option value="paused">Paused</option>
                                <option value="completed">Completed</option>
                            </select>
                            <select name="sort" class="form-select">
                                <option value="createdAt:desc">Newest first</option>
                                <option value="createdAt:asc">Oldest first</option>
                                <option value="priority:desc">By priority</option>
                                <option value="plannedDate:asc">By planned date</option>
                            </select>
                        </form>
                        <div id="tasks" class="task-list"></div>
                    </div>
                </main>
            </div>
        </div>


        <!-- New project modal -->
        <div id="project-create-modal"></div>


        <!-- Account modal (change own password) -->
        <template x-if="accountModalOpen">
            <div class="modal" @click.self="accountModalOpen = false">
                <form class="task-edit" @submit.prevent="changePassword()">
                    <h3>Change password</h3>
                    <div class="login-card__error" x-show="changePasswordError" x-cloak x-text="changePasswordError"></div>
                    <input type="password" class="form-control" placeholder="Current password"
                           x-model="changePasswordForm.currentPassword" required autocomplete="current-password" />
                    <input type="password" class="form-control" placeholder="New password"
                           x-model="changePasswordForm.password" required minlength="6" autocomplete="new-password" />
                    <input type="password" class="form-control" placeholder="Confirm new password"
                           x-model="changePasswordForm.passwordConfirmation" required minlength="6" autocomplete="new-password" />
                    <div class="task-edit__actions">
                        <button type="submit" :disabled="changePasswordSubmitting" x-text="changePasswordSubmitting ? 'Saving…' : 'Save'"></button>
                        <button type="button" class="btn-ghost" @click="accountModalOpen = false">Cancel</button>
                    </div>
                </form>
            </div>
        </template>


        <!-- Add task modal (from URL) -->
        <div x-show="addModalOpen" class="modal" @click.self="addModalOpen = false" style="display:none">
            <form class="task-edit" hx-post="/api/tasks/from-url" hx-swap="none"
                @htmx:after-request="if ($event.detail.elt === $el && $event.detail.successful) { addModalOpen = false; $el.reset(); newTaskProjectName = ''; $dispatch('refresh-tasks'); $dispatch('refresh-projects') }">
                <h3>New task</h3>

                <label class="url-import__label">Import from URL (optional)</label>
                <input type="url" name="url" class="form-control"
                       placeholder="https://example.com/projects/ecommerce/tasks/fix-login"
                       hx-post="/api/tasks/parse-url"
                       hx-trigger="input changed delay:400ms"
                       hx-target="#url-preview"
                       hx-swap="innerHTML" />
                <div id="url-preview"></div>

                <input id="field-projectName" type="text" name="projectName" class="form-control" placeholder="Project name..." x-model="newTaskProjectName" />
                <input id="field-title" type="text" name="title" class="form-control" placeholder="Task title..." required />
                <div class="task-edit__row">
                    <select name="priority" class="form-select">
                        <option value="low">low</option>
                        <option value="high">high</option>
                    </select>
                    <select name="state" class="form-select">
                        <option value="pending">pending</option>
                        <option value="active">active</option>
                        <option value="paused">paused</option>
                        <option value="completed">completed</option>
                    </select>
                </div>
                <div x-show="isManager()" x-effect="if (addModalOpen && selected) htmx.ajax('GET', '/api/tasks/assignable-users?project=' + encodeURIComponent(selected.id), {target: '#assign-create', swap: 'innerHTML'})">
                    <label class="url-import__label">Assign to</label>
                    <select id="assign-create" name="assigned_to" class="form-select">
                        <option value="">Unassigned</option>
                    </select>
                </div>
                <div class="task-edit__actions">
                    <button type="submit">Add</button>
                    <button type="button" class="btn-ghost" @click="addModalOpen = false">Cancel</button>
                </div>
            </form>
        </div>


        <!-- Edit task modal -->
        <template x-if="editing">
            <div class="modal" @click.self="editing = null">
                <form class="task-edit"
                      :hx-put="'/api/tasks/' + editing.id"
                      :hx-target="'#task-' + editing.id"
                      hx-swap="outerHTML"
                      x-init="htmx.process($el)"
                      @htmx:after-request="editing = null">
                    <h3>Edit task</h3>
                    <input type="text" name="title" class="form-control" :value="editing.title" required />
                    <div class="task-edit__row">
                        <select name="priority" class="form-select" x-model="editing.priority">
                            <option value="low">low</option>
                            <option value="high">high</option>
                        </select>
                        <select name="state" class="form-select" x-model="editing.state">
                            <option value="pending">pending</option>
                            <option value="active">active</option>
                            <option value="paused">paused</option>
                            <option value="completed">completed</option>
                        </select>
                    </div>
                    <div x-show="isManager()" x-init="htmx.ajax('GET', '/api/tasks/assignable-users?project=' + encodeURIComponent(selected?.id || '') + '&selected=' + encodeURIComponent(editing.assignedTo || ''), {target: '#assign-edit', swap: 'innerHTML'})">
                        <label class="url-import__label">Assign to</label>
                        <select id="assign-edit" name="assigned_to" class="form-select">
                            <option value="">Unassigned</option>
                        </select>
                    </div>
                    <input type="hidden" name="project" :value="selected?.id" />
                    <div class="task-edit__actions">
                        <button type="submit">Save</button>
                        <button type="button" class="btn-ghost" @click="editing = null">Cancel</button>
                    </div>
                </form>
            </div>
        </template>

        <!-- Time entry modal -->
        <template x-if="timeEntryModalOpen">
            <div class="modal time-entry-modal" @click.self="timeEntryModalOpen = false; timeEntryTask = null">
                <div class="task-edit" x-init="htmx.process($el)">
                    <h3>Track time — <span x-text="timeEntryTask?.title"></span></h3>

                    <div id="time-entry-list"
                         x-init="htmx.ajax('GET', '/api/time-entries/by-task/' + timeEntryTask?.id, {target: $el, swap: 'outerHTML'})">
                        <p class="form-hint">Loading...</p>
                    </div>

                    <div style="border-top: 1px solid var(--border); margin: .8rem 0; position: relative;">
                        <span style="position: absolute; top: -0.65rem; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 0 .6rem; font-size: .75rem; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em;">New Entry</span>
                    </div>
                    <form hx-post="/api/time-entries" hx-swap="none"
                          x-init="htmx.process($el)"
                          @htmx:after-request="if($event.detail.successful){$el.reset();htmx.ajax('GET','/api/time-entries/by-task/'+timeEntryTask?.id,{target:'#time-entry-list',swap:'outerHTML'});$dispatch('refresh-tasks')}">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: .5rem;">
                            <div>
                                <label class="url-import__label">Started at</label>
                                <input type="datetime-local" name="startedAt" class="form-control" required
                                       x-init="$el.value = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)" />
                            </div>
                            <div>
                                <label class="url-import__label">Stopped at</label>
                                <input type="datetime-local" name="stoppedAt" class="form-control" required
                                       x-init="$el.value = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)" />
                            </div>
                        </div>
                        <input type="hidden" name="task" :value="timeEntryTask?.id" />
                        <div class="task-edit__actions">
                            <button type="submit">Add</button>
                            <button type="button" class="btn-ghost" @click="timeEntryModalOpen = false; timeEntryTask = null">Close</button>
                        </div>
                    </form>
                </div>
            </div>
        </template>

        <!-- Container for HTMX-loaded modals (team, project edit) -->
        <div id="modal-container"></div>
    </div>
</body>
</html>
