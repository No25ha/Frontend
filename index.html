<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DailyFlow</title>
    <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/app.css" />
    <script>
    window.API_BASE = 'http://127.0.0.1:1337';

    // ---- Pin helpers (localStorage, per-user-per-browser) ----
    window._pins = {
      _key: function(type) { return 'df_pins_' + type; },
      get: function(type) {
        try { return new Set(JSON.parse(localStorage.getItem(window._pins._key(type)) || '[]')); }
        catch(e) { return new Set(); }
      },
      save: function(type, set) {
        try { localStorage.setItem(window._pins._key(type), JSON.stringify([...set])); } catch(e) {}
      },
      isPinned: function(type, id) { return window._pins.get(type).has(id); },
      toggle: function(type, id) {
        var s = window._pins.get(type);
        if (s.has(id)) { s.delete(id); } else { s.add(id); }
        window._pins.save(type, s);
        return s.has(id);
      }
    };

    var _SVG_PIN = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>';
    var _SVG_PIN_FILLED = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>';

    window._pinProjectSection = function(id, btn) {
      var pinned = window._pins.toggle('projects', id);
      btn.innerHTML = pinned ? _SVG_PIN_FILLED : _SVG_PIN;
      btn.title = pinned ? 'Unpin project' : 'Pin project';
      var section = btn.closest('.hp-project-group');
      if (section) section.classList.toggle('is-pinned', pinned);
      var container = document.getElementById('hp-projects');
      if (!container) return;
      var sections = Array.from(container.querySelectorAll('.hp-project-group'));
      sections.sort(function(a, b) {
        var ap = window._pins.isPinned('projects', a.dataset.projectId) ? 0 : 1;
        var bp = window._pins.isPinned('projects', b.dataset.projectId) ? 0 : 1;
        return ap - bp;
      });
      sections.forEach(function(s) { container.appendChild(s); });
    };

    window._applyPinStatesToHomepage = function() {
      var container = document.getElementById('hp-projects');
      if (!container) return;
      var sections = Array.from(container.querySelectorAll('.hp-project-group'));
      sections.forEach(function(section) {
        var id = section.dataset.projectId;
        var pinned = window._pins.isPinned('projects', id);
        section.classList.toggle('is-pinned', pinned);
        var btn = section.querySelector('.hp-section-pin');
        if (btn) { btn.innerHTML = pinned ? _SVG_PIN_FILLED : _SVG_PIN; btn.title = pinned ? 'Unpin project' : 'Pin project'; }
      });
      sections.sort(function(a, b) {
        var ap = window._pins.isPinned('projects', a.dataset.projectId) ? 0 : 1;
        var bp = window._pins.isPinned('projects', b.dataset.projectId) ? 0 : 1;
        return ap - bp;
      });
      sections.forEach(function(s) { container.appendChild(s); });
    };

    window._pinTask = function(id, btn) {
      var pinned = window._pins.toggle('tasks', id);
      btn.innerHTML = pinned ? _SVG_PIN_FILLED : _SVG_PIN;
      btn.title = pinned ? 'Unpin task' : 'Pin task';
      btn.closest('.task-card').classList.toggle('is-pinned', pinned);
      window._sortPinnedCards('.task-list', '.task-card', 'tasks');
    };

    window._pinProject = function(id, btn) {
      var pinned = window._pins.toggle('projects', id);
      btn.innerHTML = pinned ? _SVG_PIN_FILLED : _SVG_PIN;
      btn.title = pinned ? 'Unpin project' : 'Pin project';
      btn.closest('.project-card').classList.toggle('is-pinned', pinned);
      window._sortPinnedCards('.project-grid', '.project-card', 'projects');
    };

    window._sortPinnedCards = function(listSel, cardSel, type) {
      var list = document.querySelector(listSel);
      if (!list) return;
      var cards = Array.from(list.querySelectorAll(cardSel));
      cards.sort(function(a, b) {
        var ap = window._pins.isPinned(type, a.dataset.id) ? 0 : 1;
        var bp = window._pins.isPinned(type, b.dataset.id) ? 0 : 1;
        return ap - bp;
      });
      cards.forEach(function(c) { list.appendChild(c); });
    };

    window._applyPinStates = function(listSel, cardSel, type) {
      document.querySelectorAll(listSel + ' ' + cardSel).forEach(function(card) {
        var id = card.dataset.id;
        var pinned = window._pins.isPinned(type, id);
        card.classList.toggle('is-pinned', pinned);
        var btn = card.querySelector('.btn-pin');
        if (btn) { btn.innerHTML = pinned ? _SVG_PIN_FILLED : _SVG_PIN; btn.title = pinned ? 'Unpin' : 'Pin'; }
      });
      window._sortPinnedCards(listSel, cardSel, type);
    };

    window._hpSortTable = function(th) {
      var table = th.closest('table');
      var tbody = table.querySelector('tbody');
      var col = th.dataset.col;
      var asc = th.dataset.sortDir !== 'asc';
      th.closest('tr').querySelectorAll('th[data-col]').forEach(function(t) {
        t.dataset.sortDir = '';
        var ind = t.querySelector('.hp-sort-ind');
        if (ind) ind.textContent = '⇅';
      });
      th.dataset.sortDir = asc ? 'asc' : 'desc';
      var ind = th.querySelector('.hp-sort-ind');
      if (ind) ind.textContent = asc ? ' ↑' : ' ↓';

      var key = 'sort' + col.charAt(0).toUpperCase() + col.slice(1);
      var rows = Array.from(tbody.querySelectorAll('tr'));
      rows.sort(function(a, b) {
        var av = a.dataset[key] || '', bv = b.dataset[key] || '';
        var an = parseFloat(av), bn = parseFloat(bv);
        var numeric = av !== '' && bv !== '' && !isNaN(an) && !isNaN(bn);
        if (numeric) return asc ? an - bn : bn - an;
        if (av < bv) return asc ? -1 : 1;
        if (av > bv) return asc ? 1 : -1;
        return 0;
      });
      rows.forEach(function(r) { tbody.appendChild(r); });
    };

    // ── Homepage Stopwatch ───────────────────────────────────────────────
    (function(){
      var SW_KEY = 'df_hp_sw';
      var _iv = null;

      function pad(n){return n<10?'0'+n:String(n);}
      function fmtElapsed(ms){
        if(ms<0)ms=0;
        var h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000);
        return pad(h)+':'+pad(m)+':'+pad(s);
      }
      function fmtDuration(ms){
        var total=Math.round(ms/60000),h=Math.floor(total/60),m=total%60;
        if(!h)return m+'m'; if(!m)return h+'h'; return h+'h '+m+'m';
      }
      function getState(){try{return JSON.parse(localStorage.getItem(SW_KEY)||'null');}catch(e){return null;}}
      function setState(s){try{if(s)localStorage.setItem(SW_KEY,JSON.stringify(s));else localStorage.removeItem(SW_KEY);}catch(e){}}

      function tick(){
        var st=getState(),el=document.getElementById('hp-sw-elapsed');
        if(!el||!st||!st.startedAt)return;
        el.textContent=fmtElapsed(Date.now()-new Date(st.startedAt).getTime());
      }
      function setRunningUI(running){
        var start=document.getElementById('hp-sw-start'),stop=document.getElementById('hp-sw-stop');
        var label=document.getElementById('hp-sw-label'),sw=document.getElementById('hp-sw');
        var hint=document.getElementById('hp-sw-hint'),badge=document.getElementById('hp-sw-badge');
        if(!start||!stop)return;
        start.style.display=running?'none':'';
        stop.style.display=running?'':'none';
        if(sw)sw.classList.toggle('hp-sw--running',running);
        if(label)label.textContent=running?'Tracking…':'Ready to track';
        if(hint)hint.textContent=running?'Timer is running — click Stop & Save when done':'Start the stopwatch and track your work time';
        if(badge)badge.classList.toggle('hp-sw__badge--running',running);
        if(!running){var el=document.getElementById('hp-sw-elapsed');if(el)el.textContent='00:00:00';}
      }

      window._hpSwStart=function(){
        if(getState())return;
        setState({startedAt:new Date().toISOString()});
        setRunningUI(true);
        clearInterval(_iv);_iv=setInterval(tick,1000);tick();
      };
      window._hpSwStop=function(){
        var st=getState();if(!st)return;
        clearInterval(_iv);_iv=null;
        var stoppedAt=new Date().toISOString();
        setState({startedAt:st.startedAt,stoppedAt:stoppedAt});
        setRunningUI(false);
        var ms=new Date(stoppedAt)-new Date(st.startedAt);
        var info=document.getElementById('hp-sw-modal-info');
        if(info)info.textContent='Tracked: '+fmtDuration(ms);
        document.getElementById('hp-sw-modal-error').textContent='';
        document.getElementById('hp-sw-project').value='';
        var tinput=document.getElementById('hp-sw-task-input');
        if(tinput){tinput.value='';tinput.disabled=true;}
        document.getElementById('hp-sw-comment').value='';
        window._hpSwLoadProjects();
        document.getElementById('hp-sw-modal').style.display='flex';
      };
      window._hpSwCancelModal=function(){
        document.getElementById('hp-sw-modal').style.display='none';
        setState(null);
      };
      window._hpSwLoadProjects=function(){
        var token=localStorage.getItem('dailyflow_token')||'';
        var sel=document.getElementById('hp-sw-project');
        if(!sel)return;
        sel.innerHTML='<option value="">Loading…</option>';
        fetch(window.API_BASE+'/api/projects?pagination[pageSize]=200&sort=name:asc',{
          headers:{'Authorization':'Bearer '+token}
        }).then(function(r){return r.json();}).then(function(d){
          sel.innerHTML='<option value="">— Select project —</option>';
          (d&&d.data||[]).forEach(function(p){
            var o=document.createElement('option');
            o.value=p.documentId||p.id;
            o.textContent=p.name||(p.attributes&&p.attributes.name)||p.documentId;
            sel.appendChild(o);
          });
        }).catch(function(){sel.innerHTML='<option value="">— Error loading —</option>';});
      };
      window._hpSwLoadTasks=function(projectDocId){
        var tinput=document.getElementById('hp-sw-task-input');
        if(!tinput)return;
        if(!projectDocId){tinput.value='';tinput.disabled=true;return;}
        tinput.value='';tinput.disabled=false;tinput.focus();
      };
      window._hpSwSave=function(){
        var st=getState();
        if(!st||!st.startedAt||!st.stoppedAt){document.getElementById('hp-sw-modal-error').textContent='No tracked time found.';return;}
        var projSel=document.getElementById('hp-sw-project');
        var projectDocId=projSel?projSel.value:'';
        if(!projectDocId){document.getElementById('hp-sw-modal-error').textContent='Please select a project.';return;}
        var taskTitle=((document.getElementById('hp-sw-task-input')||{}).value||'').trim();
        if(!taskTitle){document.getElementById('hp-sw-modal-error').textContent='Please enter a task name.';return;}
        var comment=(document.getElementById('hp-sw-comment').value||'').trim();
        var token=localStorage.getItem('dailyflow_token')||'';
        var btn=document.getElementById('hp-sw-save');
        var projName=projSel.options[projSel.selectedIndex].text;
        btn.disabled=true;btn.textContent='Creating task…';
        // Step 1: create the task
        fetch(window.API_BASE+'/api/tasks',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
          body:JSON.stringify({title:taskTitle,project:projectDocId,state:'completed'})
        }).then(function(r){return r.ok?r.json():r.json().then(function(d){throw d;});})
        .then(function(d){
          var taskDocId=(d&&d.data&&(d.data.documentId||d.data.id))||'';
          if(!taskDocId)throw {error:{message:'Task created but no ID returned.'}};
          btn.textContent='Saving time…';
          // Step 2: create the time entry
          var payload={task:taskDocId,startedAt:st.startedAt,stoppedAt:st.stoppedAt};
          if(comment)payload.comment=comment;
          return fetch(window.API_BASE+'/api/time-entries',{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
            body:JSON.stringify(payload)
          }).then(function(r2){return r2.ok?{taskDocId:taskDocId}:r2.json().then(function(d2){throw d2;});});
        }).then(function(res){
          setState(null);
          document.getElementById('hp-sw-modal').style.display='none';
          btn.disabled=false;btn.textContent='Save';
          if(window._hpTrackRecentTask)window._hpTrackRecentTask({id:res.taskDocId,title:taskTitle,projectDocId:projectDocId,projectName:projName});
          document.body.dispatchEvent(new CustomEvent('load-homepage',{bubbles:true}));
          window.dispatchEvent(new CustomEvent('show-toast',{detail:'Time entry saved!'}));
        }).catch(function(err){
          var msg=(err&&err.error&&err.error.message)||'Save failed.';
          document.getElementById('hp-sw-modal-error').textContent=msg;
          btn.disabled=false;btn.textContent='Save';
        });
      };
      // Called after HTMX swaps the homepage HTML — restores timer state into the new DOM
      window._hpSwRestore=function(){
        clearInterval(_iv);_iv=null;
        var st=getState();
        if(!st||!st.startedAt)return;
        if(st.stoppedAt){
          var ms=new Date(st.stoppedAt)-new Date(st.startedAt);
          var info=document.getElementById('hp-sw-modal-info');
          if(info)info.textContent='Tracked: '+fmtDuration(ms);
          var errEl=document.getElementById('hp-sw-modal-error');if(errEl)errEl.textContent='';
          var projSel=document.getElementById('hp-sw-project');if(projSel)projSel.value='';
          var tinput=document.getElementById('hp-sw-task-input');
          if(tinput){tinput.value='';tinput.disabled=true;}
          var comm=document.getElementById('hp-sw-comment');if(comm)comm.value='';
          window._hpSwLoadProjects();
          var modal=document.getElementById('hp-sw-modal');if(modal)modal.style.display='flex';
        }else{
          setRunningUI(true);
          _iv=setInterval(tick,1000);tick();
        }
      };
    })();

    // ── Collapsible project groups ─────────────────────────────────────────
    var _HP_COLLAPSED_KEY = 'df_hp_collapsed';
    function _hpGetCollapsed() {
      try { return new Set(JSON.parse(localStorage.getItem(_HP_COLLAPSED_KEY) || '[]')); }
      catch(e) { return new Set(); }
    }
    function _hpSaveCollapsed(s) {
      try { localStorage.setItem(_HP_COLLAPSED_KEY, JSON.stringify([...s])); } catch(e) {}
    }
    window._hpToggleProject = function(docId, btn) {
      var wrap = document.querySelector('.hp-tasks-table-wrap[data-proj-id="' + docId + '"]');
      if (!wrap) return;
      var collapsed = _hpGetCollapsed();
      if (wrap.classList.contains('hp-proj-collapsed')) {
        wrap.classList.remove('hp-proj-collapsed');
        btn.classList.remove('hp-proj-toggle--collapsed');
        collapsed.delete(docId);
      } else {
        wrap.classList.add('hp-proj-collapsed');
        btn.classList.add('hp-proj-toggle--collapsed');
        collapsed.add(docId);
      }
      _hpSaveCollapsed(collapsed);
    };
    window._hpRestoreCollapsed = function() {
      var collapsed = _hpGetCollapsed();
      collapsed.forEach(function(docId) {
        var wrap = document.querySelector('.hp-tasks-table-wrap[data-proj-id="' + docId + '"]');
        if (!wrap) return;
        wrap.classList.add('hp-proj-collapsed');
        var section = wrap.closest('.hp-project-group');
        if (section) {
          var btn = section.querySelector('.hp-proj-toggle');
          if (btn) btn.classList.add('hp-proj-toggle--collapsed');
        }
      });
    };
    // ──────────────────────────────────────────────────────────────────────

    var _RECENT_KEY = 'df_recent_tasks';
    var _RECENT_MAX = 8;

    window._getRecentTasks = function() {
      try { return JSON.parse(localStorage.getItem(_RECENT_KEY) || '[]'); } catch(e) { return []; }
    };

    window._renderRecentTasks = function() {
      var body = document.getElementById('hp-recent-body');
      if (!body) return;
      var list = window._getRecentTasks();
      if (!list.length) {
        body.innerHTML = '<p class="hp-recent-empty">No recent tasks yet</p>';
        return;
      }
      var html = '<ul class="hp-recent-list">';
      list.forEach(function(t, i) {
        var timeStr = '';
        if (t.lastTime) {
          var d = new Date(t.lastTime);
          if (!isNaN(d)) timeStr = d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', hour12:false});
        }
        var proj = (t.projectName||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        var title = (t.title||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        var initial = (t.title||'?')[0].toUpperCase();
        var colors = ['#6366f1','#8b5cf6','#ec4899','#f59e0b','#10b981','#3b82f6','#ef4444','#14b8a6'];
        var color = colors[i % colors.length];
        html += '<li class="hp-recent-item" onclick="window._hpTrackRecentTask(' + JSON.stringify(t).replace(/"/g,'&quot;') + ');window._openProject(\'' + (t.projectDocId||'').replace(/'/g,"\\'") + '\',\'' + (t.projectName||'').replace(/'/g,"\\'") + '\',0)">'
          + '<div class="hp-recent-item__avatar" style="background:' + color + '">' + initial + '</div>'
          + '<div class="hp-recent-item__body">'
          +   '<span class="hp-recent-item__title">' + title + '</span>'
          +   '<span class="hp-recent-item__meta">'
          +     (proj ? '<span class="hp-recent-item__project">' + proj + '</span>' : '')
          +     (timeStr ? '<span class="hp-recent-item__time">' + timeStr + '</span>' : '')
          +   '</span>'
          + '</div>'
          + '<span class="hp-recent-item__arrow">›</span>'
          + '</li>';
      });
      html += '</ul>';
      body.innerHTML = html;
    };

    window._hpTrackRecentTask = function(task) {
      if (!task || !task.id) return;
      try {
        var list = window._getRecentTasks().filter(function(t) { return t.id !== task.id; });
        list.unshift({ id: task.id, title: task.title, projectDocId: task.projectDocId, projectName: task.projectName, lastTime: new Date().toISOString() });
        if (list.length > _RECENT_MAX) list = list.slice(0, _RECENT_MAX);
        localStorage.setItem(_RECENT_KEY, JSON.stringify(list));
        window.dispatchEvent(new CustomEvent('recent-tasks-updated'));
        window._renderRecentTasks();
      } catch(e) {}
    };

    window._hpTrackTaskCard = function(card) {
      if (!card) return;
      window._hpTrackRecentTask({
        id: card.dataset.id,
        title: card.dataset.title,
        projectDocId: card.dataset.projectId || '',
        projectName: card.dataset.projectName || ''
      });
    };

    window._hpDeleteTask = function(id) {
      if (!window.confirm('Are you sure you want to delete this task?')) return;
      var token = localStorage.getItem('dailyflow_token');
      fetch(window.API_BASE + '/api/tasks/' + id, {
        method: 'DELETE',
        headers: token ? { 'Authorization': 'Bearer ' + token } : {}
      }).then(function(res) {
        if (res.ok || res.status === 204) {
          document.body.dispatchEvent(new CustomEvent('load-homepage', { bubbles: true }));
        } else {
          res.json().then(function(d) {
            window.dispatchEvent(new CustomEvent('show-toast', { detail: (d && d.error && d.error.message) || 'Delete failed (' + res.status + ').' }));
          }).catch(function() {
            window.dispatchEvent(new CustomEvent('show-toast', { detail: 'Delete failed (' + res.status + ').' }));
          });
        }
      }).catch(function() {
        window.dispatchEvent(new CustomEvent('show-toast', { detail: 'Could not reach the server.' }));
      });
    };

    window._hpUpdateTask = function(form, id, taskInfo) {
      var token = localStorage.getItem('dailyflow_token');
      var payload = {};
      new FormData(form).forEach(function(v, k) { if (v !== '' && k !== 'project') payload[k] = v; });
      fetch(window.API_BASE + '/api/tasks/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify(payload)
      }).then(function(res) {
        if (res.ok) {
          if (taskInfo) window._hpTrackRecentTask({ id: id, title: payload.title || (taskInfo && taskInfo.title) || '', projectDocId: (taskInfo && taskInfo.projectDocId) || '', projectName: (taskInfo && taskInfo.projectName) || '' });
          document.body.dispatchEvent(new CustomEvent('open-edit', { bubbles: true, detail: null }));
          document.body.dispatchEvent(new CustomEvent('load-homepage', { bubbles: true }));
        } else {
          res.json().then(function(d) {
            window.dispatchEvent(new CustomEvent('show-toast', { detail: (d && d.error && d.error.message) || 'Update failed (' + res.status + ').' }));
          }).catch(function() {
            window.dispatchEvent(new CustomEvent('show-toast', { detail: 'Update failed (' + res.status + ').' }));
          });
        }
      }).catch(function() {
        window.dispatchEvent(new CustomEvent('show-toast', { detail: 'Could not reach the server.' }));
      });
    };

    window._hpEditTask = function(btn) {
      window._hpTrackRecentTask({ id: btn.dataset.id, title: btn.dataset.title, projectDocId: btn.dataset.projectDocId || '', projectName: btn.dataset.projectName || '' });
      document.body.dispatchEvent(new CustomEvent('open-edit', { bubbles: true, detail: {
        id: btn.dataset.id,
        title: btn.dataset.title,
        priority: btn.dataset.priority,
        state: btn.dataset.state,
        assignedTo: btn.dataset.assignedTo || ''
      }}));
    };

    window._openProject = function(docId, name, count) {
      window.dispatchEvent(new CustomEvent('open-project', { detail: { id: docId, name: name, count: Number(count) } }));
    };


    document.addEventListener('htmx:validateUrl', function(e) {
      var allowed = new URL(window.API_BASE).origin;
      if (!e.detail.sameHost && new URL(e.detail.url, location.href).origin !== allowed) e.preventDefault();
    });

    document.addEventListener('htmx:afterRequest', function(e) {
      var path = e.detail.pathInfo?.requestPath || '';
      var verb = (e.detail.requestConfig?.verb || '').toLowerCase();
      if (path.indexOf('/api/time-entries') !== -1 && e.detail.successful) {
        document.body.dispatchEvent(new CustomEvent('load-tasks', {bubbles: true}));
        if (verb !== 'get') {
          var card = e.detail.elt && e.detail.elt.closest && e.detail.elt.closest('.task-card');
          if (card) {
            window._hpTrackTaskCard(card);
          } else if (window.Alpine) {
            var taskInfo = null;
            try { taskInfo = Alpine.$data(document.body).timeEntryTask; } catch(err) {}
            if (taskInfo) window._hpTrackRecentTask(taskInfo);
          }
        }
      }
      if (/\/api\/tasks\/[^/]+$/.test(path) && (verb === 'put' || verb === 'delete') && e.detail.successful) {
        if (document.getElementById('hp-projects')) {
          document.body.dispatchEvent(new CustomEvent('load-homepage', {bubbles: true}));
        }
      }
    });

        return;

      var msg = null;
      try { var body = JSON.parse(xhr.responseText); msg = body && body.error && body.error.message; if (msg === 'Forbidden' || msg === 'Unauthorized') msg = null; } catch(err) {}
      if (xhr && (xhr.status === 401 || xhr.status === 403)) {

        if (!token) { window.dispatchEvent(new CustomEvent('show-toast', { detail: 'Please log in.' })); return; }

            if (!res.ok) { localStorage.removeItem('dailyflow_token'); window.dispatchEvent(new CustomEvent('session-expired')); return; }

      }
      window.dispatchEvent(new CustomEvent('show-toast', { detail: msg || 'Request failed (' + xhr.status + '). Please try again.' }));
    });

      }
    });

<body x-data="{
        page: 'home',
        selected: null,
        editing: null,

        timeEntryModalOpen: false,
        timeEntryTask: null,
        projectModalOpen: false,

        toast: null,
        newTaskProjectName: '',
        // ---------- Routing ----------
        initRoute() {
            const applyHash = () => {
                const hash = location.hash.replace('#', '') || 'home';
                if (hash === 'projects') {
                    this.page = 'projects';
                    this.$nextTick(() => this.$dispatch('load-all-projects'));
                } else if (hash === 'groups') {
                    this.page = 'groups';
                    this.$nextTick(() => this.$dispatch('load-groups'));
                } else if (hash === 'team') {
                    this.page = 'team';
                    this.$nextTick(() => this.$dispatch('load-team'));
                } else if (hash === 'tasks') {
                    if (this.selected) {
                        this.page = 'tasks';
                        this.$nextTick(() => this.$dispatch('load-tasks'));
                    } else {
                        location.hash = 'projects';
                    }
                } else {
                    this.page = 'home';
                    this.$nextTick(() => this.$dispatch('load-homepage'));
                }
            };
            window.addEventListener('hashchange', () => applyHash());
            applyHash();
        },
        navigate(p) {
            location.hash = p;
        },
        // ---------- Auth ----------
        authToken: null,
        authUser: null,
        authChecking: true,
        loginForm: { identifier: '', password: '' },
        loginError: '',
        loginSubmitting: false,
        initAuth() {
            this.authToken = localStorage.getItem('dailyflow_token');
            if (!this.authToken) { this.authChecking = false; return; }
            this.fetchMe().then((ok) => {
                this.authChecking = false;
                if (ok) {
                    this.$dispatch('load-projects');
                    this.initRoute();
                }
            });
        },
        fetchMe() {
            return fetch(window.API_BASE + '/api/users/me?populate=role', {
                headers: { Authorization: 'Bearer ' + this.authToken }
            })
                .then((res) => {
                    if (!res.ok) throw new Error('invalid session');
                    return res.json();
                })
                .then((user) => {
                    this.authUser = user;
                    this._perms = new Set(user.permissions || []);
                    return true;
                })
                .catch(() => { this.clearSession(); return false; });
        },
        login() {
            this.loginError = '';
            this.loginSubmitting = true;
            fetch(window.API_BASE + '/api/auth/local', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: this.loginForm.identifier, password: this.loginForm.password })
            })
                .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
                .then(({ ok, data }) => {
                    if (!ok) {
                        this.loginSubmitting = false;
                        this.loginError = (data.error && data.error.message) || 'Login failed. Check your email/username and password.';
                        return;
                    }
                    this.authToken = data.jwt;
                    localStorage.setItem('dailyflow_token', data.jwt);
                    this.loginForm = { identifier: '', password: '' };
                    return this.fetchMe().then((ok2) => {
                        this.loginSubmitting = false;
                        if (ok2) {
                            this.$dispatch('load-projects');
                            location.hash = 'home';
                            this.initRoute();
                        }
                    });
                })
                .catch(() => {
                    this.loginSubmitting = false;
                    this.loginError = 'Could not reach the server.';
                });
        },
        clearSession() {
            this.authToken = null;
            this.authUser = null;
            this._perms = null;
            localStorage.removeItem('dailyflow_token');
            this.selected = null;
        },
        logout() { this.clearSession(); },
        isManager() {
            const type = this.authUser?.role?.type;
            return type === 'owner' || type === 'team_lead';
        },
        _perms: null,
        can(permission) {
            return this._perms ? this._perms.has(permission) : false;

        changePassword() {
            this.changePasswordError = '';
            if (this.changePasswordForm.password.length < 6) {
                this.changePasswordError = 'New password must be at least 6 characters.';
                return;
            }
            if (this.changePasswordForm.password !== this.changePasswordForm.passwordConfirmation) {
                this.changePasswordError = 'New passwords do not match.';
                return;
            }
            this.changePasswordSubmitting = true;
            fetch(window.API_BASE + '/api/auth/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.authToken },

                    password: this.changePasswordForm.password,

            })
                .then((res) => res.json().then((data) => ({ ok: res.ok, data })))

        closeProjectModal() {

        },
        // ---------- Password visibility ----------
        showLoginPassword: false,
        // ---------- Time entry calculation ----------
        timeCalc(f, src) {
            const toLocal = (d) => {
                const p = (n) => n < 10 ? '0' + n : String(n);
                return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
            };
            const si = f.querySelector('[name=startedAt]');
            const ei = f.querySelector('[name=stoppedAt]');
            const di = f.querySelector('[name=duration]');
            const s = si ? si.value : '';
            const e = ei ? ei.value : '';
            const dur = di ? Number(di.value) : 0;
            if (src === 'start') f._lastEdited = 'start';
            if (src === 'stop') f._lastEdited = 'stop';
            if (src === 'dur' && dur > 0) {
                if (f._lastEdited === 'stop' && e) {
                    si.value = toLocal(new Date(new Date(e).getTime() - dur * 60000));
                } else if (s) {
                    ei.value = toLocal(new Date(new Date(s).getTime() + dur * 60000));
                } else if (e) {
                    si.value = toLocal(new Date(new Date(e).getTime() - dur * 60000));
                }
            } else if ((src === 'start' || src === 'stop') && s && e) {
                const diff = Math.round((new Date(e).getTime() - new Date(s).getTime()) / 60000);
                di.value = diff > 0 ? diff : '';
            } else if (src === 'start' && s && dur > 0) {
                ei.value = toLocal(new Date(new Date(s).getTime() + dur * 60000));
            } else if (src === 'stop' && e && dur > 0) {
                si.value = toLocal(new Date(new Date(e).getTime() - dur * 60000));
            }
            const err = f.querySelector('[data-time-error]');
            if (si && ei && si.value && ei.value && new Date(ei.value) < new Date(si.value)) {
                const errEl = err || (() => { const el = document.createElement('p'); el.setAttribute('data-time-error',''); el.style.cssText = 'color:#ff6b6b;font-size:.8rem;margin:.3rem 0 0'; ei.parentNode.appendChild(el); return el; })();
                errEl.textContent = 'Stopped at must be after Started at';
                ei.setCustomValidity('Stopped at must be after Started at');
            } else {
                if (err) err.remove();
                if (ei) ei.setCustomValidity('');
            }
        }
    }"

                @htmx:after-request="if ($event.detail.elt === $el && $event.detail.successful) { try { var _rd = JSON.parse($event.detail.xhr.responseText); var _t = _rd && (_rd.data || _rd); if (_t && _t.documentId) window._hpTrackRecentTask({ id: _t.documentId, title: _t.title || '', projectDocId: (selected && selected.id) || '', projectName: (selected && selected.name) || '' }); } catch(e) {} addModalOpen = false; $el.reset(); newTaskProjectName = ''; $dispatch('refresh-tasks'); $dispatch('refresh-projects') }">
                <h3>New task</h3>

                <label class="url-import__label">Import from URL (optional)</label>
                <input type="url" name="url" class="form-control"
                       placeholder="https://example.com/projects/ecommerce/tasks/fix-login"
                       hx-post="/api/tasks/parse-url"
                       hx-trigger="input changed delay:400ms"
                       hx-target="#url-preview"
                       hx-swap="innerHTML" />
                <div id="url-preview"></div>

                <input id="field-projectName" type="text" name="projectName" class="form-control" placeholder="Project name..." x-model="newTaskProjectName" />
                <input id="field-title" type="text" name="title" class="form-control" placeholder="Task title..." required />
                <div class="task-edit__row">
                    <select name="priority" class="form-select">
                        <option value="low">low</option>
                        <option value="high">high</option>
                    </select>
                    <select name="state" class="form-select">
                        <option value="pending">pending</option>
                        <option value="active">active</option>
                        <option value="paused">paused</option>
                        <option value="completed">completed</option>
                    </select>
                </div>
                <div x-show="isManager()" x-effect="if (addModalOpen && selected) htmx.ajax('GET', '/api/tasks/assignable-users?project=' + encodeURIComponent(selected.id), {target: '#assign-create', swap: 'innerHTML'})">
                    <label class="url-import__label">Assign to</label>
                    <select id="assign-create" name="assigned_to" class="form-select">
                        <option value="">Unassigned</option>
                    </select>
                </div>
                <div class="task-edit__actions">
                    <button type="submit">Add</button>
                    <button type="button" class="btn-ghost" @click="addModalOpen = false">Cancel</button>
                </div>
            </form>
        </div>


        <!-- Edit task modal -->
        <template x-if="editing">
            <div class="modal" @click.self="editing = null">
                <form class="task-edit"
                      :hx-put="'/api/tasks/' + editing.id"
                      :hx-target="'#task-' + editing.id"
                      hx-swap="outerHTML"
                      x-init="if (page !== 'home') htmx.process($el)"
                      @submit="page === 'home' && ($event.preventDefault(), _hpUpdateTask($el, editing.id, editing))"
                      @htmx:after-request="editing = null">
                    <h3>Edit task</h3>
                    <input type="text" name="title" class="form-control" :value="editing.title" required />
                    <div class="task-edit__row">
                        <select name="priority" class="form-select" x-model="editing.priority">
                            <option value="low">low</option>
                            <option value="high">high</option>
                        </select>
                        <select name="state" class="form-select" x-model="editing.state">
                            <option value="pending">pending</option>
                            <option value="active">active</option>
                            <option value="paused">paused</option>
                            <option value="completed">completed</option>
                        </select>
                    </div>
                    <div x-show="isManager()" x-init="htmx.ajax('GET', '/api/tasks/assignable-users?project=' + encodeURIComponent(selected?.id || '') + '&selected=' + encodeURIComponent(editing.assignedTo || ''), {target: '#assign-edit', swap: 'innerHTML'})">
                        <label class="url-import__label">Assign to</label>
                        <select id="assign-edit" name="assigned_to" class="form-select">
                            <option value="">Unassigned</option>
                        </select>
                    </div>
                    <input type="hidden" name="project" :value="selected?.id" />
                    <div class="task-edit__actions">
                        <button type="submit">Save</button>
                        <button type="button" class="btn-ghost" @click="editing = null">Cancel</button>
                    </div>
                </form>
            </div>
        </template>

        <!-- Time entry modal -->
        <template x-if="timeEntryModalOpen">
            <div class="modal time-entry-modal" @click.self="timeEntryModalOpen = false; timeEntryTask = null">
                <div class="task-edit" x-init="htmx.process($el)">
                    <h3>Track time — <span x-text="timeEntryTask?.title"></span></h3>

                    <div id="time-entry-list"
                         x-init="htmx.ajax('GET', '/api/time-entries/by-task/' + timeEntryTask?.id, {target: $el, swap: 'outerHTML'})">
                        <p class="form-hint">Loading...</p>
                    </div>

                    <form data-time-form hx-post="/api/time-entries" hx-swap="none"
                          x-init="htmx.process($el)"
                                                    @htmx:after-request="if($event.detail.successful){$el.reset();$el.setAttribute('hx-post','/api/time-entries');$el.removeAttribute('hx-put');htmx.process($el);$el.querySelector('[name=startedAt]').value='';$el.querySelector('[name=stoppedAt]').value='';$el.querySelector('[name=duration]').value='';$el._lastEdited=null;$el.querySelector('[data-form-label]').textContent='New Entry';$el.querySelector('[data-submit-btn]').textContent='Add';var ce=$el.querySelector('[data-cancel-edit]');if(ce)ce.remove();htmx.ajax('GET','/api/time-entries/by-task/'+timeEntryTask?.id,{target:'#time-entry-list',swap:'outerHTML'});$dispatch('refresh-tasks')}">
                        <div style="border-top: 1px solid var(--border); margin: 0 0 .8rem; padding-top: .8rem; position: relative;">
                            <span data-form-label style="position: absolute; top: -0.65rem; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 0 .6rem; font-size: .75rem; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em;">New Entry</span>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: .5rem;">
                            <div>
                                <label class="url-import__label">Started at</label>
                                <input type="datetime-local" name="startedAt" class="form-control"
                                       x-on:input="timeCalc($el.closest('form'), 'start')"
                                       x-on:change="timeCalc($el.closest('form'), 'start')" />
                            </div>
                            <div>
                                <label class="url-import__label">Stopped at</label>
                                <input type="datetime-local" name="stoppedAt" class="form-control"
                                       x-on:input="timeCalc($el.closest('form'), 'stop')"
                                       x-on:change="timeCalc($el.closest('form'), 'stop')" />
                            </div>
                        </div>
                        <div>
                            <label class="url-import__label">Duration (minutes)</label>
                            <input type="number" name="duration" class="form-control" min="1" placeholder="Auto-calculated"
                                   x-on:input="timeCalc($el.closest('form'), 'dur')" />
                        </div>
                        <div>
                            <label class="url-import__label">Comment</label>
                            <input type="text" name="comment" class="form-control" placeholder="Optional note..." />
                        </div>
                        <input type="hidden" name="task" :value="timeEntryTask?.id" />
                        <div class="task-edit__actions" style="margin-top: .5rem;">
                            <button data-submit-btn type="submit">Add</button>
                            <button type="button" class="btn-ghost" @click="timeEntryModalOpen = false; timeEntryTask = null">Close</button>
                        </div>
                    </form>
                </div>
            </div>
        </template>

        <!-- Container for HTMX-loaded modals -->
        <div id="modal-container"></div>
    </div>
</body>
</html>
